<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- Two things going on here: an explicit modern SVG icon, plus a
         freshly-NAMED PNG fallback (not a re-save of an old filename).
         Chrome/Safari cache whatever they first saw at /favicon.ico
         completely separately from normal HTTP caching -- a corrected
         file at that same old path can sit invisible behind that cache
         for days. A brand-new filename has no old cache entry to hide
         behind, so browsers that honour <link rel="icon"> (basically
         all current ones) show the real, current mark immediately. -->
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/brand-icon.png" type="image/png" sizes="192x192" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFDF9" />
    <meta name="description" content="LERN helps young people turn real work into trusted, verified proof — so they get seen and hired safely through their school, college, or training provider." />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lernapp.uk" />
    <meta property="og:site_name" content="LERN" />
    <meta property="og:title" content="LERN — Verified proof of what a young person can do" />
    <meta property="og:description" content="LERN helps young people turn real work into trusted, verified proof — so they get seen and hired safely through their school, college, or training provider." />
    <meta property="og:image" content="https://lernapp.uk/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LERN — Verified proof of what a young person can do" />
    <meta name="twitter:description" content="LERN helps young people turn real work into trusted, verified proof — so they get seen and hired safely through their school, college, or training provider." />
    <meta name="twitter:image" content="https://lernapp.uk/og-image.svg" />
    <!-- iOS doesn't accept SVG here at all -- this was silently failing
         before, not just stale. A real PNG, same fresh filename as above. -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/brand-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>LERN — Verified work, safely, from classroom to career</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
